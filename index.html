<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="app-icon.png">
    <title>OBC Plumbing Sizer</title>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-muted: #8e8e93;
            --primary-blue: #007aff;
            --border-color: #e5e5ea;
        }
        
        /* Universal box-sizing prevents elements from overflowing their containers */
        * { box-sizing: border-box; }
        
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-color); margin: 0; padding: 16px; color: var(--text-main); -webkit-font-smoothing: antialiased; }
        
        /* Header */
        .header-card { background: linear-gradient(135deg, #002855, #004080); color: white; padding: 24px 16px; border-radius: 16px; margin-bottom: 20px; text-align: center; box-shadow: 0 8px 24px rgba(0,40,85,0.15); }
        .header-card h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .header-card p { margin: 8px 0 0; font-size: 14px; color: #a1c2ea; font-weight: 500; }
        
        /* Cards */
        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02); }
        .title { font-weight: 600; font-size: 17px; margin-bottom: 4px; letter-spacing: -0.3px; }
        .sub { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
        
        /* Inputs */
        input[type="text"], select { font-family: inherit; font-size: 16px; padding: 14px; border-radius: 12px; border: 1px solid #d1d1d6; background: #fafafa; width: 100%; margin-top: 10px; outline: none; -webkit-appearance: none; transition: all 0.2s ease; }
        input[type="text"]:focus, select:focus { border-color: var(--primary-blue); background: #fff; box-shadow: 0 0 0 3px rgba(0,122,255,0.15); }
        
        /* Perfectly Centered CSS Grid Dashboard */
        .summary-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            margin-top: 16px; 
        }
        .summary-box { 
            background: #f8f9fa; 
            padding: 16px 8px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .val { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 2px; }
        .fu-val { color: var(--primary-blue); }
        .dfu-val { color: #af52de; }
        .pipe-val { color: #34c759; }
        .vent-val { color: #ff9500; }
        .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; font-weight: 700; letter-spacing: 0.5px; text-align: center; }
        
        /* Centered Vent Card */
        .vent-card {
            background: #f8f9fa; 
            padding: 16px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            margin-top: 12px;
            text-align: center;
        }
        
        /* List Items */
        .row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border-color); }
        .row:last-child { border-bottom: none; padding-bottom: 0; }
        .row:first-of-type { padding-top: 8px; }
