<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>OBC Plumbing Sizer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f2f2f7; margin: 0; padding: 16px; color: #000; }
        .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 16px; }
        .header h1 { margin: 0; font-size: 22px; }
        .header p { margin: 4px 0 0; font-size: 14px; color: #8e8e93; }
        input[type="text"], select { font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #c7c7cc; background: #f2f2f7; width: 100%; margin-top: 8px; outline: none; box-sizing: border-box; -webkit-appearance: none; }
        .summary-grid { display: flex; justify-content: space-between; text-align: center; margin-top: 12px; flex-wrap: wrap; }
        .summary-box { width: 48%; background: #f9f9eb; padding: 12px 0; border-radius: 8px; margin-bottom: 8px; }
        .val { font-size: 22px; font-weight: bold; }
        .fu-val { color: #007aff; }
        .dfu-val { color: #af52de; }
        .pipe-val { color: #34c759; }
        .vent-val { color: #ff9500; }
        .lbl { font-size: 11px; color: #8e8e93; text-transform: uppercase; margin-top: 4px; font-weight: 600; }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #e5e5ea; }
        .row:last-child { border-bottom: none; }
        .title { font-weight: 500; font-size: 16px; margin-bottom: 2px; }
        .sub { font-size: 12px; color: #8e8e93; }
        .btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #007aff; background: #fff; color: #007aff; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; padding-bottom: 3px; box-sizing: border-box; }
        .cnt { width: 26px; text-align: center; font-size: 16px; font-weight: 600; display: inline-block; }
        .warning-box { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 500; text-align: center; }
        .ok { background: #e5fbe9; color: #1e8334; }
        .alert { background: #ffebee; color: #d32f2f; }
        .control-group { display: flex; align-items: center; }
        .action-btn { background: #007aff; color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        
        /* Print Styles for PDF Generation */
        @media print {
            body { background: white; padding: 0; color: black; }
            .card { box-shadow: none; border: 1px solid #000; margin-bottom: 12px; page-break-inside: avoid; }
            .btn, select, .action-btn, .control-group { display: none !important; }
            input[type="text"] { border: none; background: transparent; padding: 0; font-weight: bold; font-size: 18px; margin-top: 4px; }
            .summary-box { background: transparent; border: 1px solid #ccc; }
            .cnt { display: inline-block; width: auto; font-size: 16px; }
            .cnt::before { content: "Qty: "; font-weight: normal; }
            .warning-box { border: 1px solid #000; }
        }
    </style>
</head>
<body>
    
    <div class="header">
        <h1>OBC Plumbing Sizer</h1>
        <p>Water Supply, Drainage & Venting</p>
    </div>

    <!-- Project Details -->
    <div class="card">
        <div class="title">Project Details</div>
        <input type="text" id="project-name" placeholder="Enter Project Name or Address (e.g., 1117 Purdy Rd)">
        
        <div style="margin-top: 16px;" class="title no-print">Incoming Lake/Well Line</div>
        <select id="suction-size" onchange="update()">
            <option value="0.75">3/4" (NPS 3/4)</option>
            <option value="1.0">1" (NPS 1)</option>
            <option value="1.25" selected>1 1/4" (NPS 1 1/4)</option>
            <option value="1.5">1 1/2" (NPS 1 1/2)</option>
            <option value="2.0">2" (NPS 2)</option>
        </select>
    </div>

    <!-- Master Summary Dashboard -->
    <div class="card">
        <div class="title" style="text-align: center; border-bottom: 1px solid #eee; padding-bottom: 8px;">System Sizing Report</div>
        
        <div class="summary-grid">
            <div class="summary-box">
                <div id="total-fu" class="val fu-val">0.0</div>
                <div class="lbl">Water Load (FU)</div>
            </div>
            <div class="summary-box">
                <div id="pipe-size" class="val pipe-val">3/4"</div>
                <div class="lbl">Min Water Main</div>
            </div>
            <div class="summary-box">
                <div id="total-dfu" class="val dfu-val">0.0</div>
                <div class="lbl">Drain Load (DFU)</div>
            </div>
            <div class="summary-box">
                <div id="drain-size" class="val vent-val">3"</div>
                <div class="lbl">Main Sewer (ABS)</div>
            </div>
        </div>
        
        <div class="row" style="padding-bottom: 0; justify-content: center;">
            <div style="text-align: center;">
                <div class="title" style="font-size: 14px; margin-top:8px;">Main Vent Stack Required: <span id="vent-size" style="font-weight:bold; color: #ff9500;">2"</span></div>
            </div>
        </div>

        <div id="status-message" class="warning-box ok"></div>
    </div>

    <!-- Fixture Inputs -->
    <div class="card" id="fixture-list"></div>

    <button class="action-btn no-print" onclick="window.print()">Generate PDF Report</button>

    <script>
        // Water FU (Supply) and Drainage FU (DFU) per OBC
        const fixtures = [
            { name: "Full Bath Group", desc: "Toilet, Sink, Tub/Shower", fu: 3.6, dfu: 6.0, toilet: true, count: 0 },
            { name: "Half Bath Group", desc: "Toilet & Sink Only", fu: 2.6, dfu: 5.0, toilet: true, count: 0 },
            { name: "Toilet (≤ 6 LPF)", desc: "Individual", fu: 2.2, dfu: 4.0, toilet: true, count: 1 },
            { name: "Bathtub or Shower", desc: "Individual", fu: 1.4, dfu: 1.5, toilet: false, count: 1 },
            { name: "Bathroom Sink", desc: "Lavatory", fu: 0.7, dfu: 1.0, toilet: false, count: 1 },
            { name: "Kitchen Sink", desc: "Standard", fu: 1.4, dfu: 1.5, toilet: false, count: 1 },
            { name: "Clothes Washer", desc: "Laundry", fu: 1.4, dfu: 2.0, toilet: false, count: 0 },
            { name: "Dishwasher", desc: "Kitchen", fu: 1.4, dfu: 1.5, toilet: false, count: 0 },
            { name: "Hose Bibb", desc: "Exterior Valve (No Drain)", fu: 2.5, dfu: 0.0, toilet: false, count: 1 }
        ];

        function update() {
            let totalFU = 0;
            let totalDFU = 0;
            let hasToilet = false;

            const container = document.getElementById("fixture-list");
            container.innerHTML = "<div class='title' style='margin-bottom: 8px;'>Plumbing Fixtures</div>";
            
            fixtures.forEach((item, idx) => {
                totalFU += item.count * item.fu;
                totalDFU += item.count * item.dfu;
                if (item.count > 0 && item.toilet) hasToilet = true;

                // Only show items with count > 0 in print mode, but show all in app mode
                container.innerHTML += `
                    <div class="row" style="${item.count === 0 ? '@media print { display: none; }' : ''}">
                        <div>
                            <div class="title">${item.name}</div>
                            <div class="sub">${item.desc} • ${item.fu} FU / ${item.dfu} DFU</div>
                        </div>
                        <div class="control-group">
                            <button class="btn no-print" onclick="change(${idx}, -1)">-</button>
                            <span class="cnt">${item.count}</span>
                            <button class="btn no-print" onclick="change(${idx}, 1)">+</button>
                        </div>
                    </div>`;
            });

            // Update Summaries
            document.getElementById("total-fu").innerText = totalFU.toFixed(1);
            document.getElementById("total-dfu").innerText = totalDFU.toFixed(1);
            
            // 1. Water Supply Sizing
            let waterStr = "3/4\"";
            let waterNum = 0.75;
            if (totalFU > 26 && totalFU <= 41) { waterStr = "1\""; waterNum = 1.0; } 
            else if (totalFU > 41) { waterStr = "1 1/4\""; waterNum = 1.25; }
            document.getElementById("pipe-size").innerText = waterStr;

            // 2. Building Drain Sizing (ABS)
            let drainStr = "3\"";
            if (totalDFU > 27) { drainStr = "4\""; } // Under OBC, > 27 DFU jumps from 3" to 4" main
            if (!hasToilet && totalDFU <= 6) { drainStr = "2\""; } // Tiny cabins with no toilet
            document.getElementById("drain-size").innerText = drainStr;

            // 3. Vent Sizing
            let ventStr = "2\"";
            if (hasToilet) { ventStr = "3\" (Min. Stack)"; } // Must have a 3" vent going through roof if toilet is present
            document.getElementById("vent-size").innerText = ventStr;

            // Warning Checks
            const suctionSelect = document.getElementById("suction-size");
            const suctionVal = parseFloat(suctionSelect.value);
            const suctionText = suctionSelect.options[suctionSelect.selectedIndex].text.split(" ")[0];
            const statusMsg = document.getElementById("status-message");

            if (suctionVal < waterNum) {
                statusMsg.className = "warning-box alert";
                statusMsg.innerHTML = `⚠️ <b>Bottleneck:</b> ${suctionText} incoming supply is smaller than the required ${waterStr} house main.`;
            } else {
                statusMsg.className = "warning-box ok";
                statusMsg.innerHTML = `✅ <b>System Valid:</b> Supply and Drainage sizing conforms to OBC Part 7 limits.`;
            }
        }

        function change(idx, delta) {
            fixtures[idx].count = Math.max(0, fixtures[idx].count + delta);
            update();
        }

        update();
    </script>
</body>
</html>
